[package]
name = "hft_bot"
version = "0.1.0"
edition = "2021"
description = "Binance single-venue HFT research harness: live L1 collector, NDJSON storage, offline replay, and a depth-agnostic feature engine."

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

[profile.release]
lto = true
codegen-units = 1
